[config]
type = "pipeline"
chartbook_format_version = "0.0.2"

[site]
title = "p13_Bai_Collin-Dufresne_2019"
author = "Nicholas Kebo & Lucie Martin"
copyright = "2025"
logo_path = ""
favicon_path = ""

[pipeline]
id = "P1"
pipeline_name = "p13_Bai_Collin-Dufresne_2019"
pipeline_description = "A data science project"
lead_pipeline_developer = "Nicholas Kebo & Lucie Martin"
contributors = ["Nicholas Kebo & Lucie Martin"]
software_modules_command = "module load anaconda3/3.11.4 TeXLive/2023"
runs_on_grid_or_windows_or_other = "Windows/Linux/MacOS"
git_repo_URL = ""
README_file_path = "./README.md"


[notebooks]

[notebooks.notebook_interactive_ipynb]
notebook_name = "Notebook Data Tour"
notebook_description = "Brief tour of the cleaned data and the main replication steps for Figure 1 and Table 1."
notebook_path = "_output/notebook_interactive_ipynb.html"


[dataframes]

[dataframes.bond_prices]
data_sources = ["WRDS Bond Returns"]
data_providers = ["WRDS"]
how_is_pulled = "Pulled via WRDS from Bond Returns (monthly)"
path_to_parquet_data = "_data/bond_prices.parquet"
dataframe_docs_str = "Bond prices/yields used to proxy PECDS and match to CDS."
date_col = "date"

[dataframes.cds]
data_sources = ["Markit CDS"]
data_providers = ["WRDS"]
how_is_pulled = "Pulled via WRDS Markit CDS table"
path_to_parquet_data = "_data/CDS.parquet"
dataframe_docs_str = "Daily CDS spreads (5Y) used to compute CDS–bond basis."
date_col = "date"

[dataframes.ratings]
data_sources = ["Mergent FISD Ratings"]
data_providers = ["WRDS / LSEG Mergent"]
how_is_pulled = "Pulled from Mergent FISD ratings table"
path_to_parquet_data = "_data/Mergent_FISD_ratings.parquet"
dataframe_docs_str = "Bond ratings data used to tag IG vs HY."
date_col = "rating_date"

[dataframes.matched_bond_cds]
data_sources = ["Constructed bond-CDS matched panel"]
data_providers = ["Internal"]
how_is_pulled = "Built by src/filter_data.py by matching bond monthly to CDS daily by ticker and month"
path_to_parquet_data = "_data/matched_bond_cds.parquet"
dataframe_docs_str = "Matched panel used to compute PECDS and basis."
date_col = "date"

[dataframes.pecds]
data_sources = ["Constructed PECDS proxy"]
data_providers = ["Internal"]
how_is_pulled = "Built by src/calc_PECDS.py"
path_to_parquet_data = "_data/pecds.parquet"
dataframe_docs_str = "Bond-implied CDS spread proxy (PECDS)."
date_col = "date"

[dataframes.basis]
data_sources = ["Constructed CDS-bond basis"]
data_providers = ["Internal"]
how_is_pulled = "Built by src/calc_basis.py"
path_to_parquet_data = "_data/basis.parquet"
dataframe_docs_str = "Basis = CDS spread - PECDS proxy; used for Table 1 and Figure 1."
date_col = "date"


[charts]

[charts.figure1_replication]
chart_name = "Figure 1 (Replication Window) CDS-Bond Basis"
short_description_chart = "Median basis with 10th/90th percentiles for IG and HY, through SAMPLE_END_DATE."
dataframe_id = "basis"
path_to_html_chart = "_output/replication_figure1.html"
chart_docs_str = "Replication of Bai & Collin-Dufresne (2019) Figure 1."
topic_tags = ["cds", "basis"]
data_frequency = "daily"
observation_period = "2006-07-01 to 2014-12-30"
lag_in_data_release = "unknown"
data_release_timing = "historical"
units = "basis points"

[charts.figure1_extension]
chart_name = "Figure 1 (Extended) CDS-Bond Basis"
short_description_chart = "Same as Figure 1 but extended through END_DATE."
dataframe_id = "basis"
path_to_html_chart = "_output/extension_figure1.html"
chart_docs_str = "Extension of Figure 1 through end date."
topic_tags = ["cds", "basis"]
data_frequency = "daily"
observation_period = "2006-07-01 to 2022-03-31"
lag_in_data_release = "unknown"
data_release_timing = "historical"
units = "basis points"